services:
  app:
    image: ghcr.io/niveskz/edunova-agente-rag:latest
    restart: unless-stopped
    # Medido localmente (Passo 8): so importar torch/transformers ja usa
    # ~930MB de RSS antes de carregar qualquer modelo; com o e5-small
    # carregado (uma unica vez, cacheado) fica em ~1.4GB em regime estavel.
    # O limite de 1g original nao tinha essa folga e o container morria por
    # OOM (exit 137) reguarmente. 2g da margem sobre o pico medido.
    cpus: "1.0"
    mem_limit: "2g"
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # ORACLE_WALLET_DIR no .env da VM deve apontar pro caminho dentro do
      # container, ex.: /app/wallet/Wallet_edunovadb (nao pro caminho do host).
      - ./wallet:/app/wallet:ro
      - ./logs:/app/logs
