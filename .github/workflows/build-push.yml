name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # VM A1 Flex e ARM (Ampere Altra) - imagem tem que ser linux/arm64,
          # nao a arquitetura padrao (amd64) dos runners do GitHub Actions.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/niveskz/edunova-agente-rag:latest
            ghcr.io/niveskz/edunova-agente-rag:${{ github.sha }}
